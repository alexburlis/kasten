# Local validating resolver for Stalwart: recursive from the root, DNSSEC on, loopback only.
# kasten setup points Stalwart's x:DnsResolver at it: Custom, 127.0.0.1 port 5335, UDP with tcpOnError.
# Runs as the kasten user in the foreground; kasten-server serve starts it before Stalwart.
server:
  interface: 127.0.0.1@5335
  access-control: 127.0.0.0/8 allow
  do-ip4: yes
  # Docker bridge networks have no IPv6 route by default.
  do-ip6: no
  do-udp: yes
  do-tcp: yes

  username: ""
  chroot: ""
  directory: "/run/kasten"
  pidfile: ""
  use-syslog: no
  logfile: ""
  verbosity: 1
  log-servfail: yes

  # Validation. The root trust anchor comes from Debian's dns-root-data package and is
  # refreshed when the image is rebuilt; no runtime download.
  module-config: "validator iterator"
  trust-anchor-file: "/usr/share/dns/root.key"
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  qname-minimisation: yes
  hide-identity: yes
  hide-version: yes
  # DNSBLs answer 127.255.255.x to refuse a query (Spamhaus: .254 for public resolvers, .255
  # over the query limit), and several pinned spam rules count any answer as a listing. Unbound
  # drops these addresses from answers, so Stalwart sees no listing.
  private-address: 127.255.255.0/24

  # Small footprint for a 1 GB server.
  num-threads: 1
  so-reuseport: no
  # Use the kernel's socket buffer sizes; raising them needs root.
  so-rcvbuf: 0
  so-sndbuf: 0
  msg-cache-size: 4m
  rrset-cache-size: 8m
  key-cache-size: 1m
  neg-cache-size: 1m
  infra-cache-numhosts: 2000
  outgoing-range: 256
  num-queries-per-thread: 128
  prefetch: yes

# kasten-server serve rewrites this file at every start. It stays empty unless the
# development-only KASTEN_DEV_DNS_FORWARD is set.
include-toplevel: "/run/kasten/unbound-dev.conf"
