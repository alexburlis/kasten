# Installed as /etc/systemd/system/tangd.socket.d/kasten.conf on the Tang host.
# Tang listens only on this host's tailnet address, never on port 80 or a public address.
# FreeBind lets the socket bind the address before tailscale0 has it.
#
# Debian's tangd.socket is ordered before sockets.target, which comes before tailscaled.service.
# Ordering it after tailscaled therefore needs DefaultDependencies=no, or systemd finds a cycle.
[Unit]
DefaultDependencies=no
Requires=sysinit.target kasten-tang-firewall.service
After=sysinit.target tailscaled.service kasten-tang-firewall.service
Conflicts=shutdown.target
Before=shutdown.target

[Socket]
ListenStream=
ListenStream=@TAILNET_IP@:@PORT@
FreeBind=yes
