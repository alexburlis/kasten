#!/usr/sbin/nft -f
# Kasten host firewall: stateful, default deny in every direction.
# install.sh installs this file as /etc/sysconfig/nftables.conf, which Fedora's nftables.service
# loads, and writes the SSH admin addresses into the two sets. It replaces only the "inet kasten"
# table. It never flushes the whole ruleset, because Tailscale keeps its own tables. Podman adds no
# rules: the containers use the host's network, or none.

destroy table inet kasten

table inet kasten {
	# SSH from these addresses or networks is allowed on any interface.
	set admin_v4 {
		type ipv4_addr
		flags interval
		# kasten:admin_v4
	}

	set admin_v6 {
		type ipv6_addr
		flags interval
		# kasten:admin_v6
	}

	chain input {
		type filter hook input priority filter; policy drop;

		iif lo accept
		ct state invalid drop
		ct state established,related accept

		icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, echo-request, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept

		# Public: inbound mail and the HTTPS mail API (JMAP, sign-in, ACME TLS-ALPN-01).
		tcp dport { 25, 443 } accept

		# Tailscale: direct WireGuard connections from peers.
		udp dport 41641 accept

		# SSH only over the tailnet or from the admin sets.
		iifname "tailscale0" tcp dport 22 accept
		ip saddr @admin_v4 tcp dport 22 accept
		ip6 saddr @admin_v6 tcp dport 22 accept

		# DHCP lease replies, if the provider assigns addresses by DHCP.
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept
	}

	# This host routes nothing: no container networks, no subnet router, no exit node.
	chain forward {
		type filter hook forward priority filter; policy drop;
	}

	chain output {
		type filter hook output priority filter; policy drop;

		oif lo accept

		# Never send SMTP from this host. Outgoing mail goes to SES on port 587.
		tcp dport 25 drop

		ct state invalid drop
		ct state established,related accept
		meta l4proto { icmp, ipv6-icmp } accept

		# SSH replies to the admin sets. When this file first loads, conntrack meets the SSH
		# session that runs install.sh in mid-stream and counts its next reply as new, so the
		# established rule above misses it and the session would freeze.
		ip daddr @admin_v4 tcp sport 22 accept
		ip6 daddr @admin_v6 tcp sport 22 accept

		# The tailnet: Tang, administration and MagicDNS.
		oifname "tailscale0" accept

		# DNS (the resolver in the mail container queries authoritative servers directly) and NTP.
		udp dport { 53, 123 } accept
		tcp dport 53 accept

		# HTTPS (Fedora updates, ACME, Tailscale control and DERP) and SES SMTP.
		tcp dport { 443, 587 } accept

		# The provider's metadata service: plain HTTP to a link-local address. On Hetzner Cloud,
		# cloud-init reads it at every boot, before the network starts; without this rule it would
		# wait two minutes there, then fail. Root only: the containers' users cannot reach it.
		ip daddr 169.254.169.254 tcp dport 80 meta skuid 0 accept
		ip6 daddr fe80::a9fe:a9fe tcp dport 80 meta skuid 0 accept

		# Tailscale: WireGuard to peers and STUN.
		udp sport 41641 accept
		udp dport 3478 accept

		# DHCP lease requests.
		udp sport 68 udp dport 67 accept
		udp sport 546 udp dport 547 accept
	}
}
