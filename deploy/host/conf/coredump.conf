# Installed as /etc/systemd/coredump.conf.d/kasten.conf.
# A core dump holds the crashed process's memory: decrypted mail and credentials. Fedora sends every
# dump to systemd-coredump, which by default stores it in /var/lib/systemd/coredump on the
# unencrypted disk. Now it stores none; the journal in RAM records only the crash.
[Coredump]
Storage=none
ProcessSizeMax=0
