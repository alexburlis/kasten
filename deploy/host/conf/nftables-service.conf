# Drop-in for nftables.service, installed as /etc/systemd/system/nftables.service.d/kasten.conf.
# Fedora's ExecStop runs "nft flush ruleset", and its ExecReload flushes the ruleset before it
# loads the file again. Both remove Tailscale's tables, and the stop leaves the host open.
# Stopping the unit now leaves the firewall loaded. Reload and restart replace only the
# "inet kasten" table, in one transaction: the file begins with "destroy table inet kasten".
[Service]
ExecStop=
ExecReload=
ExecReload=/sbin/nft -f /etc/sysconfig/nftables.conf
