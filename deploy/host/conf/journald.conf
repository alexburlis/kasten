# Installed as /etc/systemd/journald.conf.d/kasten.conf.
# Logs stay in RAM and never reach the unencrypted root disk. They do not survive a reboot.
# Container logs arrive here too (podman.sh: --log-driver=journald). Nothing is forwarded to a
# syslog daemon, which would write to /var/log on the disk; install.sh also refuses to run beside one.
[Journal]
Storage=volatile
RuntimeMaxUse=32M
RuntimeMaxFileSize=8M
ForwardToSyslog=no
