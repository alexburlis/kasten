# Installed as /etc/sysctl.d/50-kasten.conf.
# The mail container runs as the unprivileged kasten user on the host's network, and Stalwart binds
# ports 25 and 443. Unprivileged ports start at 25 instead of 1024; ports below 25, such as SSH on
# 22, stay privileged. The setting covers IPv6 too.
net.ipv4.ip_unprivileged_port_start = 25
