# Installed as /etc/systemd/zram-generator.conf, in place of Fedora's default. Compressed swap in
# RAM only: zram has no backing device here, so nothing is ever written back to disk. Half the RAM,
# lz4, and a higher priority than any other swap.
[zram0]
zram-size = ram / 2
compression-algorithm = lz4
swap-priority = 100
