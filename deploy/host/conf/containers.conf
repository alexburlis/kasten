# Installed as /etc/containers/containers.conf.d/50-kasten.conf. Rootless Podman reads it too.
[containers]
# Container logs go to journald, which keeps them in RAM (journald.conf), never to log files on
# the disk. podman.sh also sets this on every container.
log_driver = "journald"

[engine]
# No journal event for each health check, one every 30 s: the 32 MiB journal in RAM is for logs.
healthcheck_events = false
