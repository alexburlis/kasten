# Installed as /etc/dnf/automatic.conf. dnf5-automatic.timer runs dnf5 automatic every morning. It
# downloads and applies all Fedora updates: security and bug fixes, and also new upstream versions
# of packages such as Podman, crun, systemd and the kernel. It never reboots;
# "dnf5 needs-restarting" says when a reboot is due (not "-C", which fails on Fedora 44 and 45).
[commands]
upgrade_type = default
download_updates = yes
apply_updates = yes
reboot = never

[emitters]
emit_via = stdio
