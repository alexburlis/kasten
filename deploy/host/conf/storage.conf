# Installed as /home/kasten/.config/containers/storage.conf: the storage settings of the kasten
# user's rootless Podman, which reads this file instead of /etc/containers/storage.conf.
[storage]
driver = "overlay"
# Podman's database and each container's state, including the environment of every exec (the
# backup settings) and the arguments of every run (such as an address in a CLI command), stay in
# the run root, /run/user/2600/containers, in RAM. Without it, Podman writes them to the root disk.
# The images stay on the disk, in /home/kasten/.local/share/containers/storage, and survive a
# reboot. Every Kasten container is removed when it stops, so none needs to.
transient_store = true
