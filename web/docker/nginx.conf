# kasten-web's nginx. It runs unprivileged on a read-only root filesystem: the pid file, temporary
# files and the generated server block (see kasten-web-start) live in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # No query strings in the log: /oauth/callback carries the authorization code.
  log_format kasten '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout kasten;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json
    application/manifest+json image/svg+xml text/plain;

  include /tmp/kasten-web/server.conf;
}
