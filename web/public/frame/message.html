<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- kasten-web sends the same policy with frame-ancestors as a header. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data: blob:; font-src data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
  </head>
  <body></body>
</html>
