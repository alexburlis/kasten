# Dovecot 2.4 for the import-imap integration test: one maildir per user under /srv/mail, folder
# names stored as UTF-8, "/" as the hierarchy separator, and the usual special-use folders.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = *
log_path = /dev/stderr

# The test also logs in over plain 143 from the host, as Proton Bridge users do over loopback.
auth_allow_cleartext = yes
auth_mechanisms = plain

passdb passwd-file {
  passwd_file_path = /etc/dovecot/users
}

userdb static {
  fields {
    uid = vmail
    gid = vmail
    home = /srv/mail/%{user | username}
  }
}

mail_driver = maildir
mail_path = ~/Maildir
mail_inbox_path = ~/Maildir/INBOX
mailbox_list_layout = fs
mailbox_list_utf8 = yes

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }

  mailbox Sent {
    special_use = \Sent
    auto = create
  }

  mailbox Trash {
    special_use = \Trash
    auto = create
  }

  mailbox Junk {
    special_use = \Junk
    auto = create
  }

  # Stalwart's defaults have no \Archive folder, so the import creates one with that use.
  mailbox Archive {
    special_use = \Archive
    auto = create
  }
}

ssl = yes
ssl_server_cert_file = /etc/dovecot/tls/cert.pem
ssl_server_key_file = /etc/dovecot/tls/key.pem

service imap-login {
  inet_listener imap {
    port = 143
  }

  inet_listener imaps {
    port = 993
    ssl = yes
  }
}
